# Falla si un archivo versionado trae una llave de Supabase (JWT heredada anon o service_role, sb_secret_, sb_publishable_ o el
# token personal sbp_ de la cuenta). 2026-11-13: la service_role heredada de la Suite estuvo escrita en check-remote-migrations.mjs
# de este repo público. El guardia no necesita dependencias y nunca imprime una llave: sólo archivo, línea y tipo.
# Revisión 111 (SF13): además del árbol, revisa las líneas que agrega cada commit del push o del pull request. Una llave que se
# agrega y se quita en otro commit ya no está en el árbol, pero sí en el historial público.
# Revisión sec2 (2026-11-14, SF-3): también corren las pruebas del guardia (`scripts/test-supabase-keys.mjs`). Necesitan
# `typescript` (cargan el cliente del middleware), así que van después de instalar; el guardia corre antes, sin dependencias.
# Revisión sec2b (2026-11-14, SF-R5): el guardia también lee el mensaje de cada commit, el nombre y la ruta de cada archivo y el destino
# de cada enlace simbólico. N9: el checkout no deja guardado el token de GitHub para los pasos siguientes (ni el guardia ni la
# instalación lo necesitan: ninguna dependencia viene de git), y cada acción va fijada por el SHA del commit al que apuntaba su
# etiqueta @v4 el 2026-11-14 (checkout v4.4.0, pnpm/action-setup v4.3.0, setup-node v4.4.0).
name: Llaves de Supabase fuera del código

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # El rango (base..cabeza) necesita el historial completo, no sólo el último commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
      - name: Árbol y cada commit del push o del pull request
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/check-no-supabase-keys.mjs
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              node scripts/check-no-supabase-keys.mjs --rango "$PR_BASE..$GITHUB_SHA"
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                BEFORE=$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")
              fi
              node scripts/check-no-supabase-keys.mjs --rango "$BEFORE..$GITHUB_SHA"
              ;;
          esac
      - run: pnpm install --frozen-lockfile
      - name: Pruebas del guardia
        run: node --test scripts/test-supabase-keys.mjs
